global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "ke-events-api"
    static_configs:
      - targets: ["api-1:8080", "api-2:8080"]

  - job_name: "ke-events-worker"
    static_configs:
      - targets: ["worker-1:9090", "worker-2:9090"]

  - job_name: "redpanda"
    static_configs:
      - targets: ["redpanda:9644"]
    metrics_path: /public_metrics

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2

  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ke_user
      POSTGRES_PASSWORD: ke_password
      POSTGRES_DB: ke_events
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "hot_standby=on"
    ports:
      - "15432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-primary.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deploy/postgres/02-hba.sh:/docker-entrypoint-initdb.d/02-hba.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ke_user -d ke_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: replicator_pass
      POSTGRES_USER: ke_user
      POSTGRES_PASSWORD: ke_password
      POSTGRES_DB: ke_events
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        rm -rf /var/lib/postgresql/data/*;
        until pg_basebackup -h postgres-primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -R -P; do sleep 2; done;
        chmod 700 /var/lib/postgresql/data;
      fi;
      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ke_user -d ke_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ke_user
      DB_PASSWORD: ke_password
      DB_HOST: postgres-primary
      DB_NAME: ke_events
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
    depends_on:
      postgres-primary:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.8
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://redpanda:8082
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --check=false
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -s3 -s3.port=9000"
    ports:
      - "19000:9000"
      - "9333:9333"
    volumes:
      - minio_data:/data

  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_password
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  api-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment: &common_env
      INSTANCE_ID: api-1
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":50051"
      DATABASE_URL: "postgres://ke_user:ke_password@pgbouncer:5432/ke_events?sslmode=disable"
      DATABASE_READ_URL: "postgres://ke_user:ke_password@postgres-replica:5432/ke_events?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "redpanda:9092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin_secret"
      MINIO_BUCKET: "ke-event-media"
      MINIO_PUBLIC_URL: "http://localhost:19000"
      JWT_SECRET: "ke-events-super-secret-jwt-key-change-in-prod"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    ports:
      - "50051:50051"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *common_env
      INSTANCE_ID: api-2
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *common_env
      INSTANCE_ID: worker-1
      METRICS_ADDR: ":9090"
      WORKER_SHARDS: "worker-1,worker-2"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *common_env
      INSTANCE_ID: worker-2
      METRICS_ADDR: ":9090"
      WORKER_SHARDS: "worker-1,worker-2"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pg_primary_data:
  pg_replica_data:
  minio_data:
